# check.py が使う日本語の検査規則
#
# category："誤り"＝根拠が「誤り」「不適切」「適切ではない」と明記しているもの（直す）
#           "注意"＝根拠が「〜方が良い」「冗長」などと書くもの、または慣用で避けられているもの（文脈で判断）
# min_level / max_level：当てはめる段階（0〜5）。省略時は 0〜5
# media：当てはめる媒体。省略時は全部
# source：根拠。ページは「敬語の指針」の本文に印字されたページ。一覧は references/sources.md
#
# 指針が「問題ない」としているもの（とんでもございません／お伺いする／お召し上がりになる／
# 御利用いただきまして／お待ちする 等）は拾わない。

# --- 二重敬語：一つの語に同じ種類の敬語を二重に使ったもの ---
# 指針 p.30「二重敬語は，一般に適切ではないとされている」。例に挙がるのは「お読みになられる」。
# 「お見えになる」「お召し上がりになる」「お伺いする」は定着した例として許容（同ページ）。

[[rule]]
pattern = "おっしゃられ"
category = "誤り"
message = "二重敬語（おっしゃる＋れる）"
fix = "おっしゃっ／おっしゃい"
source = "敬語の指針 p.30（二重敬語）／国語に関する世論調査 平成25年度 p.15"
min_level = 2

[[rule]]
pattern = "ご覧になられ|御覧になられ"
category = "誤り"
message = "二重敬語（ご覧になる＋れる）"
fix = "ご覧になっ"
source = "敬語の指針 p.30（二重敬語）"
min_level = 2

[[rule]]
pattern = "お越しになられ|おいでになられ|お休みになられ|お召しになられ"
category = "誤り"
message = "二重敬語（お〜になる＋れる）"
fix = "お越しになっ／いらっしゃっ など"
source = "敬語の指針 p.30（二重敬語）"
min_level = 2

[[rule]]
pattern = "お[一-龥]{1,2}(り|き|ち|し|み|え|い|め|け|せ|ぎ|び)になられ"
category = "誤り"
message = "二重敬語（お〜になる＋れる。指針の例は「お読みになられる」）"
fix = "お〜になっ"
source = "敬語の指針 p.30（二重敬語）"
min_level = 2

[[rule]]
pattern = "(参ら|申さ)れ"
category = "誤り"
message = "謙譲語Ⅱ（参る・申す）に「れる」を付けて相手の動作に使っている"
fix = "いらっしゃっ／おっしゃっ"
source = "敬語の指針 p.18（相手側の行為に謙譲語Ⅱは不適切）"
min_level = 2

# --- 謙譲語を相手の動作に使う ---

[[rule]]
pattern = "[おご御](?!願い)[一-龥][一-龥ぁ-ん]{0,3}して(ください|くださ|いただ|頂)"
category = "誤り"
message = "「お（ご）〜する」は謙譲語Ⅰ。相手にしてもらう動作に「お（ご）〜してください／していただく」は使えない"
fix = "「して」を削る：ご確認ください／ご連絡いただけますか"
source = "敬語の指針 p.31・問【10】p.37"
min_level = 2

[[rule]]
pattern = "伺って(ください|くださ|いただ|頂)"
category = "誤り"
message = "「伺う」は謙譲語Ⅰ。相手の動作には使えない"
fix = "お聞きください／お尋ねください／お越しください"
source = "敬語の指針 p.30〜31・問【10】p.37"
min_level = 2

[[rule]]
pattern = "[ご御][一-龥]{2}され(る|た|ます|まし|て|ない|ません)"
category = "誤り"
message = "「ご〜される」は尊敬語の適切な形ではないとされている"
fix = "ご〜になる／〜される／ご〜なさる（例：ご確認になる・確認される）"
source = "敬語の指針 p.25・問【7】p.36"
min_level = 2

[[rule]]
pattern = "[ご御](利用|乗車|参加|購入|入場|来場|来店|出席|入会|退会)(でき|出来)"
category = "誤り"
message = "向かう先の人物がいない動詞に「ご〜できる」。相手の動作でも自分の動作でも使えない"
fix = "相手：ご利用になれます／ご利用いただけます　自分：参加できます"
source = "敬語の指針 p.25・p.27・問【8】p.36"
min_level = 2

[[rule]]
pattern = "(私|わたくし|弊社|当社|小社)の(お|ご|御)(考え|意見|旅行|気持ち|名前|住所|都合|家族|趣味)"
category = "誤り"
message = "自分側のものごとに尊敬の「お・ご」を付けている"
fix = "「お・ご」を削る"
source = "敬語の指針 問【16】p.39"

# --- 宛名 ---

[[rule]]
pattern = "(様|先生)\\s*御中|御中\\s*様"
category = "誤り"
message = "「御中」は組織あての脇付け。個人名・「様」「先生」と一緒に使わない"
fix = "○○先生／○○様／○○部 御中 のどれか一つ"
source = "敬語の指針 問【21】p.43"

[[rule]]
pattern = "先生様|各位様|各位殿"
category = "注意"
message = "敬称が重なっている"
fix = "○○先生／関係者各位"
source = "慣用"

# --- 言い回し ---

[[rule]]
pattern = "ご苦労様|御苦労様|ご苦労さま"
category = "注意"
message = "目上の人には「ご苦労様」を使わない方がよい"
fix = "ありがとうございました／お疲れ様でした"
source = "敬語の指針 問【27】p.45〜46"
min_level = 2

[[rule]]
pattern = "(いただいて|して)もよろしい(です|でしょう)か"
category = "注意"
message = "依頼を許可の形にすると回りくどい。簡潔に頼める場面なら避ける"
fix = "〜していただけますか"
source = "敬語の指針 問【33】p.49"
min_level = 2

[[rule]]
pattern = "拝見させていただ|拝読させていただ|伺わせていただ|拝聴させていただ"
category = "注意"
message = "謙譲語にさらに「させていただく」を重ねていて冗長"
fix = "拝見し／拝読し／伺い"
source = "慣用（指針に記載なし。「させていただく」の条件は問【18】p.40〜41）"
min_level = 2

# --- さ入れ言葉：五段動詞には「せる」が付く ---

[[rule]]
pattern = "(休ま|行か|言わ|帰ら|読ま|書か|送ら|知ら|使わ|待た|取ら|作ら|伺わ|頑張ら|終わら|やら|話さ|出さ|渡さ|返さ|貸さ|探さ|試さ)させて"
category = "誤り"
message = "さ入れ言葉（五段動詞には「せる」が付く）"
fix = "休ませて／行かせて など"
source = "国語に関する世論調査 平成27年度"
min_level = 1

# --- メールの慣用 ---

[[rule]]
pattern = "御社"
category = "注意"
message = "書き言葉（メール・書類）では「貴社」が慣用。「御社」は話し言葉"
fix = "貴社"
source = "厚生労働省 応募書類パンフレット p.9（国立国語研究所は「御社」も書き言葉で通用とする）"
media = ["email", "form"]
min_level = 3

[[rule]]
pattern = "[①-⑳㈱㈲㈹㍉㌔㌢㍍㌘㌧㌃㌶㍑㍗㌍㌦㌣㌫㍊㌻㎜㎝㎞㎎㎏㏄㎡№℡]"
category = "注意"
message = "機種依存文字。相手の環境で化けることがある"
fix = "(1)／（株）／ミリ などに"
source = "福岡労働局 就活OnePointAdvice⑥（2016）"
media = ["email", "form"]

[[rule]]
pattern = "の候|みぎり|拝啓|敬具|時下|陽春|残暑|向寒|師走の"
category = "注意"
message = "時候の挨拶・頭語。メールでは省く"
fix = "削る"
source = "福岡労働局 就活OnePointAdvice⑥（2016）"
media = ["email"]

# --- フリマの取引メッセージ ---

[[rule]]
pattern = "LINE ?ID|ライン ?ID|インスタ|Instagram|@[A-Za-z0-9_]{3,}|https?://|0[789]0[-‐ー−]?\\d{4}[-‐ー−]?\\d{4}"
category = "誤り"
message = "連絡先・SNS・外部サイトへの誘導（メルカリでは禁止）"
fix = "削る"
source = "メルカリ ガイド「外部への誘導の禁止」"
media = ["marketplace"]
